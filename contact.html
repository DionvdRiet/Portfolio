<!DOCTYPE html>
<html>
<head>
	<title>Contact | Portfoliowebsite Dion van der Riet</title>
	<link rel="stylesheet" type="text/css" href="../CSS/stylesheet.css">
	<link rel="stylesheet" href="https://use.typekit.net/gqv3dkc.css">
	<link rel="shortcut icon" type="image/png" href="../Afbeeldingen/favicon.ico"/>
	<meta charset="UTF-8">
</head>
<body onload="caseSwitchAnimationDown()" class="contactBody">
	<div id="caseSwitchAnimation"></div>
	<header id="desktop">
			<div class="progress-container">
				<div class="progress-bar" id="myBar"></div>
			</div>
			<div id="headerContainer" class="headerContainerCase">
				<div class="headerPages">
					<span class="header-inactive-page" onclick="home()">Welkom</span>
					<a class="header-active-page">Contact</a>
				</div>

				<div class="lang-switch" role="radiogroup" aria-label="Taalselectie">
				  <div class="lang-indicator"></div>
				  
				  <button type="button" class="lang-btn active-lang" data-lang="nl" aria-label="Nederlands">NL</button>
				  <button type="button" class="lang-btn" data-lang="en" aria-label="Engels">EN</button>
				</div>

			</div>
			<!-- <div class="headerIndicator">
				<div id="headerContainer1"></div>
				<div id="headerContainer2" id="headerContainerActive"></div>
				<div id="headerContainer3"></div>
			</div> -->
		</header>
	<header id="responsive-nav">
			<div class="progress-container">
				<div class="progress-bar" id="myBarResponsive"></div>
			</div>
			<div class="responsive-nav-top">
				<div class="arrow-left" id="arrow-left-mobile" onclick="home()">
					<img src="../Afbeeldingen/arrow-left.svg" width="50px">
				</div>
				<div class="hamburger-menu" id="hamburger-menu" onclick="overlay()">
					<div id="hamburger-1"></div>
					<div id="hamburger-2"></div>
				</div>
				<span id="mobile-nav-title">Contact</span>
			</div>
			<div id="responsive-nav-list">
				<span id="responsive-nav-list-item-1" onclick="home()">Welkom</span>
				<span id="responsive-nav-list-item-2" onclick="contact()">Contact</span>
			</div>
		</header>
	<section class="contactContent">
		<div class="contactCardContainer" id="contactDesktop">
			<div class="contactCard" id="contact1">
				<div class="contactCardTitle">
					<div class="contactCardIcon contactCardIconEmail"></div>
					<h4 data-i18n="contact.email">E-mail</h4>
				</div>
				<div class="contactCardDescription">
					<a class="p-small" href="mailto:dionvanderriet@gmail.com">dionvanderriet@gmail.com</a>
				</div>
			</div>
			<div class="contactCard" id="contact2">
				<div class="contactCardTitle">
					<div class="contactCardIcon contactCardIconTelefoon"></div>
					<h4 data-i18n="contact.phone">Telefoon</h4>
				</div>
				<div class="contactCardDescription">
					<a class="p-small" href="tel:+31621374084">+31 6 21374084</a>
				</div>
			</div>
			<div class="contactCard" id="contact3">
				<div class="contactCardTitle">
					<div class="contactCardIcon contactCardIconLinkedin"></div>
					<h4>Linkedin</h4>
				</div>
				<div class="contactCardDescription">
					<a class="p-small" href="https://www.linkedin.com/in/dion-van-der-riet-217479158" target="_blank" rel="noopener noreferrer">in/dion-van-der-riet-217479158</a>
				</div>
			</div>

			<div class="contactBackground1"></div>
			<div class="contactBackground2"></div>
		</div>

		<div class="contactCardContainer" id="contactMobile">
			<div class="contactCard" id="contact1">
				<div class="contactCardTitle">
					<div class="contactCardIcon contactCardIconEmail"></div>
					<h3 data-i18n="contact.email">E-mail</h3>
				</div>
				<div class="contactCardDescription">
					<div class="contactCardDescriptionP">
						<input class="p-small" id="contact-email-text-res" value="dionvanderriet@gmail.com">
					</div>
					<div class="contactCardDescriptionButton">
						<input type="button" name="button" value="Kopieer adres" class="buttonSmall" id="contactEmailRes" onclick="emailCopiedContactRes()">
					</div>
				</div>
			</div>
			<div class="contactCard" id="contact2">
				<div class="contactCardTitle">
					<div class="contactCardIcon contactCardIconTelefoon"></div>
					<h3 data-i18n="contact.phone">Telefoon</h3>
				</div>
				<div class="contactCardDescription">
					<div class="contactCardDescriptionP">
						<a href="tel:+31621374084">+31 6 21374084</a>
					</div>

					<div class="contactCardDescriptionButton">
						<input type="button" name="button" value="Kopieer nummer" class="buttonSmall" id="contactPhoneRes" onclick="phoneCopiedContactRes()">
					</div>
				</div>
			</div>
			<div class="contactCard" id="contact3">
				<div class="contactCardTitle">
					<div class="contactCardIcon contactCardIconLinkedin"></div>
					<h3>Linkedin</h3>
				</div>
				<div class="contactCardDescription">
					<div class="contactCardDescriptionP">
						<p class="p-small">in/dion-van-der-riet-217479158</p>
					</div>

					<div class="contactCardDescriptionButton">
						<input type="button" name="button" value="Open link" class="buttonSmall" onclick="linkedIn()">
					</div>
				</div>
			</div>
			<div class="contactBackground1"></div>
			<div class="contactBackground2"></div>
		</div>
	</section>

	<script type="text/javascript" src="../Javascript/script.js"></script>
</body>
</html>
